version: '3.8'

services:
  db-postgres:
    image: postgres:15
    container_name: passman-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: passman_user
      POSTGRES_PASSWORD: passman_secure_pass
      POSTGRES_DB: passman_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:latest
    container_name: passman-kms
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kms
      - PERSISTENCE=1
    volumes:
      - ./localstack-data:/var/lib/localstack

  api-rest:
    build: .
    container_name: passman-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PASSMAN_DB_HOST=db-postgres
      - PASSMAN_DB_PASS=passman_secure_pass
      - PASSMAN_KMS_ENDPOINT=http://localstack:4566
      - PASSMAN_KMS_ARN=arn:aws:kms:us-east-1:000000000000:key/020d2b78-714b-4f5e-a659-2766036d2dd5
    depends_on:
      - db-postgres
      - localstack